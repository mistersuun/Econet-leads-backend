spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false
server:
  port: 8081

app:
  scraper:
    enabled: false

  scheduler:
    enabled: false

logging:
  level:
    com.econet.leads: DEBUG
