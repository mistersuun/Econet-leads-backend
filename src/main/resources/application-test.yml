spring:
  datasource:
    # PostgreSQL compatibility mode; JSONB is declared as a domain so the DataSource.config column
    # (columnDefinition = "jsonb") can be created by Hibernate on H2.
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false
server:
  port: 8081

app:
  jwt:
    # Test-only secrets (>= 32 bytes)
    secret: test-access-secret-0123456789abcdef0123456789abcdef
    refresh-secret: test-refresh-secret-0123456789abcdef0123456789abcdef
  admin:
    initial-password: test-admin-password
  scraper:
    mock-pages-jaunes: true  # mock source with invented businesses; never enable in prod
    enabled: false

  scheduler:
    enabled: false

logging:
  level:
    com.econet.leads: INFO
