spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: ${PORT:8080}

app:
  scraper:
    headless: true
    rate-limit-ms: 3000  # Be more conservative in production

logging:
  level:
    com.econet.leads: INFO
    org.springframework.web: WARN
