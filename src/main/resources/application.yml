spring:
  application:
    name: econet-leads-backend

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Montreal
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Montreal

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Application Configuration
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-256-bits-for-hs256-algorithm}
    expiration-ms: 86400000  # 24 hours
    refresh-secret: ${JWT_REFRESH_SECRET:dev-refresh-secret-key-change-in-production-min-256-bits-for-hs256-algorithm}
    refresh-expiration-ms: 2592000000  # 30 days

  scraper:
    enabled: true
    headless: true
    rate-limit-ms: 2000
    max-retries: 3
    timeout-seconds: 30

  scheduler:
    enabled: true

  geocoding:
    enabled: true
    provider: openstreetmap  # or 'google'
    google-api-key: ${GOOGLE_MAPS_API_KEY:}

logging:
  level:
    root: INFO
    com.econet.leads: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
