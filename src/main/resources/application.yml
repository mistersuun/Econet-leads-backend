spring:
  application:
    name: econet-leads-backend

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Montreal
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Montreal

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

server:
  port: 8080
  # Honor X-Forwarded-* from the Azure Container Apps ingress
  forward-headers-strategy: framework
  servlet:
    context-path: /
  compression:
    enabled: true

management:
  health:
    # Redis is on the classpath but not used by the application (cache is Caffeine); don't let an
    # unreachable Redis mark the container unhealthy.
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Application Configuration
app:
  jwt:
    # REQUIRED outside the local profile: at least 32 bytes each, e.g. `openssl rand -hex 32`.
    # Startup fails if they are missing or too short (see JwtConfigProperties).
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000  # 24 hours
    refresh-secret: ${JWT_REFRESH_SECRET:}
    refresh-expiration-ms: 2592000000  # 30 days

  admin:
    # Password of the bootstrap admin, used only when no admin account exists yet (or when the admin
    # still has the well-known seed password from V2). If empty, a random password is generated and
    # logged once at WARN level. Never overwrites a password that was changed.
    initial-password: ${ADMIN_INITIAL_PASSWORD:}

  cors:
    # Comma-separated list of origins allowed to call the API from a browser
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  import:
    pool-size: 2         # concurrent background imports
    queue-capacity: 100  # queued imports before new ones are rejected

  scraper:
    enabled: true
    headless: true
    rate-limit-ms: 2000
    max-retries: 3
    timeout-seconds: 30

  scheduler:
    enabled: true

  geocoding:
    enabled: true
    provider: openstreetmap  # or 'google'
    google-api-key: ${GOOGLE_MAPS_API_KEY:}

logging:
  level:
    root: INFO
    com.econet.leads: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
