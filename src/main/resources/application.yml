spring:
  application:
    name: econet-leads-backend

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Montreal
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Montreal

  servlet:
    multipart:
      # Registre des entreprises ZIP (~225 MB) uploaded by an admin; written to disk, never buffered in memory
      max-file-size: 300MB
      max-request-size: 305MB
      file-size-threshold: 1MB

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

server:
  port: 8080
  tomcat:
    # let Tomcat read (and reject with 413) oversized uploads instead of resetting the connection
    max-swallow-size: -1
  # Honor X-Forwarded-* from the Azure Container Apps ingress
  forward-headers-strategy: framework
  servlet:
    context-path: /
  compression:
    enabled: true

management:
  health:
    # Redis is on the classpath but not used by the application (cache is Caffeine); don't let an
    # unreachable Redis mark the container unhealthy.
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Application Configuration
app:
  jwt:
    # REQUIRED outside the local profile: at least 32 bytes each, e.g. `openssl rand -hex 32`.
    # Startup fails if they are missing or too short (see JwtConfigProperties).
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000  # 24 hours
    refresh-secret: ${JWT_REFRESH_SECRET:}
    refresh-expiration-ms: 2592000000  # 30 days

  admin:
    # Password of the bootstrap admin, used only when no admin account exists yet (or when the admin
    # still has the well-known seed password from V2). If empty, a random password is generated and
    # logged once at WARN level. Never overwrites a password that was changed.
    initial-password: ${ADMIN_INITIAL_PASSWORD:}

  cors:
    # Comma-separated list of origins allowed to call the API from a browser
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  import:
    pool-size: 2         # concurrent background imports
    queue-capacity: 100  # queued imports before new ones are rejected

  scraper:
    enabled: true
    headless: true
    rate-limit-ms: 2000
    max-retries: 3
    timeout-seconds: 30

  scheduler:
    enabled: true

  sse:
    heartbeat-ms: 25000   # comment line keeping the event stream alive
    timeout-ms: 3600000   # emitter lifetime; EventSource reconnects transparently (Last-Event-ID replay)

  claims:
    ttl-minutes: 10       # a claimed lead is released after this unless refreshed
    sweep-ms: 30000

  mail:
    # Outgoing SMTP for follow-up emails. Nothing is sent unless SMTP_HOST is set
    # (GET /api/email/status reports configured: false and sends return 503).
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${MAIL_FROM:}            # defaults to SMTP_USERNAME
    from-name: ${MAIL_FROM_NAME:EcoNet Propreté}
    starttls: ${SMTP_STARTTLS:true}
    rate-limit-per-hour: 20        # per user

  website:
    # Read-only Postgres of the public website (Supabase session pooler, sslmode=require). Nothing is
    # imported and the "Site web – demandes" source stays unconfigured while WEBSITE_DB_URL is empty.
    # Accepts jdbc:postgresql://host:5432/db?sslmode=require or postgresql://user:pass@host:5432/db.
    db:
      url: ${WEBSITE_DB_URL:}
      username: ${WEBSITE_DB_USERNAME:}
      password: ${WEBSITE_DB_PASSWORD:}
    poll-minutes: ${WEBSITE_POLL_MINUTES:5}   # only polled when configured

  discover:
    # OpenStreetMap discovery (POST /api/discover/osm); ODbL: the UI must show the attribution
    # OVERPASS_URL (optional) is tried first, then the mirrors below in order; the last one that answered is
    # tried first for an hour. A failing endpoint (connect error, timeout, 429, 5xx) falls through to the next.
    overpass-url: ${OVERPASS_URL:}
    overpass-urls: https://overpass.kumi.systems/api/interpreter,https://overpass-api.de/api/interpreter,https://overpass.private.coffee/api/interpreter,https://maps.mail.ru/osm/tools/overpass/api/interpreter
    remember-minutes: 60
    nominatim-url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org}
    timeout-seconds: 25
    min-interval-ms: 1000   # 1 request/second towards each public endpoint

  # Public base URL of this API (links in emails/pages) and of the CRM (links in alerts). Blank public-url =
  # derived from the request, falling back to http://localhost:8080.
  public-url: ${APP_PUBLIC_URL:}
  crm-url: ${CRM_URL:http://localhost:5173}

  sms:
    # Twilio REST over plain HTTP. Configured only when all three are set; otherwise follow-up SMS return
    # 503 and no alert SMS is sent. TWILIO_FROM is an E.164 number, e.g. +14385551234.
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from: ${TWILIO_FROM:}
    follow-up-limit-per-hour: 20   # per user

  alerts:
    # Owner alerts for each new inbound website lead. Comma-separated lists; each is optional.
    phone: ${ALERT_PHONE:}   # E.164 numbers (SMS, needs the Twilio variables above)
    email: ${ALERT_EMAIL:}   # needs SMTP
    max-sms-per-day: 30

  places:
    # Google Places API (New) enrichment of leads; optional, the CRM shows "non configuré" while the key is empty.
    api-key: ${GOOGLE_PLACES_API_KEY:}
    daily-limit: ${PLACES_DAILY_LIMIT:100}   # calls per day (Montreal time)

  weekly-report:
    # Monday coaching email (America/Montreal), sent only when SMTP is configured
    cron: ${WEEKLY_REPORT_CRON:0 30 7 * * MON}

  company:
    name: ${COMPANY_NAME:EcoNet Propreté}

  reviews:
    # Google review link sent to clients after the first cleaning (clients page). Optional.
    google-url: ${GOOGLE_REVIEW_URL:}

  geocoding:
    enabled: true
    provider: openstreetmap  # or 'google'
    google-api-key: ${GOOGLE_MAPS_API_KEY:}

logging:
  level:
    root: INFO
    com.econet.leads: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
