spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/econet_leads_dev
    username: postgres
    password: ${DB_PASSWORD:postgres}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    # Disable validation in development to allow migration file changes
    # Run 'mvn flyway:repair' manually after modifying migration files
    validate-on-migrate: false

server:
  port: 8081

app:
  jwt:
    # Local-development-only defaults. Every other profile must set JWT_SECRET / JWT_REFRESH_SECRET.
    secret: ${JWT_SECRET:local-dev-only-access-secret-not-for-production-0123456789}
    refresh-secret: ${JWT_REFRESH_SECRET:local-dev-only-refresh-secret-not-for-production-0123456789}
  admin:
    # Local convenience: the bootstrap admin gets admin123 unless ADMIN_INITIAL_PASSWORD is set
    initial-password: ${ADMIN_INITIAL_PASSWORD:admin123}
  seed:
    # Creates ~60 DEMO businesses with call history on startup (only in the local profile, only if none exist)
    demo-data: ${SEED_DEMO_DATA:true}
  scraper:
    mock-pages-jaunes: true  # mock source with invented businesses; never enable in prod
    headless: false  # Show browser for debugging

logging:
  level:
    com.econet.leads: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
